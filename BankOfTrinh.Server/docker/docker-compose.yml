name: bankoftrinh

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bankoftrinh-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - bankoftrinh

